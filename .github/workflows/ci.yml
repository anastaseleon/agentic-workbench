name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Tests guard the template itself; they do not apply to a filled copy.
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
